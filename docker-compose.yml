version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Avoid mounting node_modules from host to prevent OS-level binary mismatch
      - /app/node_modules
    environment:
      - VITE_API_URL=https://rag-2qr1.onrender.com
    command: sh -c "npm install && npm run dev -- --host"
    restart: unless-stopped
